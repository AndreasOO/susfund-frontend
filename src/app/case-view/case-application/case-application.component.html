<div>
  <h1 class="mb-3">Application</h1>
  <div *ngIf="caseApplicationUtil?.questionResults" class="container">
    <div *ngFor="let sections of caseApplicationUtil?.questionResults" class="row mb-4">
      <h3>{{ sections[0].applicationQuestion.applicationSection.name}}</h3>
      <div *ngFor="let question of sections" class="col-8">
        <div>
          <div class="card rounded-4 p-3 bg-dark-subtle text-dark m-2">
            <h4>{{ question.applicationQuestion.title }}</h4>
            <h5>{{ question.applicationQuestion.preamble }}</h5>
            <h6>{{ question.applicationQuestion.assistingText }}</h6>
            <textarea class="form-control" rows="3" [value]="question.answer" #answerInput></textarea>
            <a class="btn btn-secondary m-2 col-2 ms-auto" (click)="saveUpdate(answerInput.value, question.applicationQuestion.id)">Save</a>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
